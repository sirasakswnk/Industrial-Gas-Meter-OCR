<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f1f5f9}
  body{font-family:'Sarabun',"TH Sarabun New",sans-serif; color:#0f172a;
       -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .sheet{width:1480px; margin:24px auto; background:#fff; padding:26px 28px 30px; border-radius:6px}
  .head{text-align:center; margin-bottom:8px}
  .head h1{font-size:23px; font-weight:700; margin:0 0 3px}
  .head p{font-size:17px; color:#475569; margin:0}
  text{font-family:'Sarabun',"TH Sarabun New",sans-serif}
  .actor{fill:#fff; font-size:15.5px; font-weight:700}
  .actorsub{fill:#cbd5e1; font-size:12.5px; font-weight:400}
  .lbl{fill:#1e293b; font-size:14px}
  .phase{fill:#334155; font-size:15px; font-weight:700}
  .loop{fill:#1e293b; font-size:12.5px; font-weight:700}
  .loopnote{fill:#475569; font-size:13px}
  .legend{fill:#475569; font-size:13px}
  .caption{text-align:center; margin-top:10px; font-size:17px; font-weight:600}
  @page{size:A4 landscape; margin:10mm}
  @media print{
    html,body{background:#fff}
    .sheet{width:auto; margin:0; padding:0; border-radius:0}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <h1>Sequence Diagram — การอ่านค่าและการบันทึกค่ามิเตอร์</h1>

  </div>

      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

#475569" stroke-width="1.1" rx="1.5"/><rect x="530" y="284" width="535" height="218" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/><rect x="40" y="109" width="1340" height="26" rx="13" fill="#e2e8f0"/><text x="710.0" y="127" text-anchor="middle" class="phase">ระยะที่ 1 — การอ่านค่าจากภาพถ่าย</text><line x1="200.5" y1="158" x2="424.5" y2="158" stroke="#1e293b" stroke-width="1.5" marker-end="url(#ah)"/><text x="312.5" y="151" text-anchor="middle" class="lbl">เลือกชุดมิเตอร์และอัปโหลดภาพถ่าย</text><line x1="435.5" y1="198" x2="674.5" y2="198" stroke="#1e293b" stroke-width="1.5" marker-end="url(#ah)"/><text x="555.0" y="191" text-anchor="middle" class="lbl">POST /api/ocr — ส่งภาพทั้งชุดในคำขอเดียว</text><path d="M 685.5 238 h 34 v 22 h -34" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/><text x="729.5" y="254" class="lbl">ตรวจสอบชนิดไฟล์ และสร้างรหัสประจำคำขอ</text><rect x="530" y="284" width="86" height="19" fill="#cbd5e1" rx="3"/><text x="573" y="298" text-anchor="middle" class="loop">loop</text><text x="624" y="298" class="loopnote">[ ทำซ้ำสำหรับภาพทุกภาพในคำขอ ]</text><path d="M 685.5 314 h 34 v 22 h -34" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/><text x="729.5" y="330" class="lbl">ปรับทิศทางตาม EXIF และแปลงเป็น RGB</text><line x1="685.5" y1="364" x2="889.5" y2="364" stroke="#1e293b" stroke-width="1.5" marker-end="url(#ah)"/><text x="787.5" y="357" text-anchor="middle" class="lbl">ส่งภาพเพื่อตรวจจับหน้าปัด</text><line x1="889.5" y1="404" x2="685.5" y2="404" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahr)"/><text x="787.5" y="397" text-anchor="middle" class="lbl">พิกัดมุมทั้งสี่ ประเภทมิเตอร์ และค่าความเชื่อมั่น</text><path d="M 685.5 444 h 34 v 22 h -34" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/><text x="729.5" y="460" class="lbl">ปรับภาพให้ตั้งตรง ครอบตัด และปรับความคมชัด</text><path d="M 685.5 504 h 34 v 22 h -34" fill ><text x="555.0" y="1301" text-anchor="middle" class="lbl">GET /api/readings/{id}/pdf</text><line x1="685.5" y1="1348" x2="1249.5" y2="1348" stroke="#1e293b" stroke-width="1.5" marker-end="url(#ah)"/><text x="967.5" y="1341" text-anchor="middle" class="lbl">อ่านการจดค่าครั้งนี้และครั้งก่อน</text><line x1="1249.5" y1="1388" x2="685.5" y2="1388" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahr)"/><text x="967.5" y="1381" text-anchor="middle" class="lbl">ข้อมูลการจดค่าทั้งสองครั้ง</text><path d="M 685.5 1428 h 34 v 22 h -34" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/><text x="729.5" y="1444" class="lbl">สร้างเอกสาร PDF จากข้อมูลในฐานข้อมูล</text><line x1="674.5" y1="1478" x2="435.5" y2="1478" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahr)"/><text x="555.0" y="1471" text-anchor="middle" class="lbl">ไฟล์ PDF ใบแจ้งปริมาณการใช้ก๊าซ</text><line x1="424.5" y1="1518" x2="200.5" y2="1518" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahr)"/><text x="312.5" y="1511" text-anchor="middle" class="lbl">ดาวน์โหลดรายงาน และล็อกช่องไม่ให้แก้ไขอีก</text><rect x="103" y="18" width="184" height="62" rx="7" fill="#1e293b"/><text x="195" y="42" text-anchor="middle" class="actor">ผู้ใช้งาน</text><text x="195" y="62" text-anchor="middle" class="actorsub">เจ้าหน้าที่ผู้บันทึกค่า</text><rect x="338" y="18" width="184" height="62" rx="7" fill="#1e293b"/><text x="430" y="42" text-anchor="middle" class="actor">หน้าเว็บ</text><text x="430" y="62" text-anchor="middle" class="actorsub">Browser / JavaScript</text><rect x="588" y="18" width="184" height="62" rx="7" fill="#1e293b"/><text x="680" y="42" text-anchor="middle" class="actor">ส่วนประมวลผลหลัก</text><text x="680" y="62" text-anchor="middle" class="actorsub">server.py</text><rect x="803" y="18" width="184" height="62" rx="7" fill="#1e293b"/><text x="895" y="42" text-anchor="middle" class="actor">แบบจำลองตรวจจับ</text><tex
