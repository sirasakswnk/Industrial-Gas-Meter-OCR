<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการจดค่า — Automated Industrial Gas Meter Reading with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/index.css?v=14">
</head>

<body>
    <div class="app-shell">

        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-gauge-high"></i></div>
                <div class="logo-text">
                    <h1>Automated Industrial Gas Meter Reading with AI</h1>
                    <span>Meter Industrial Reader Portal</span>
                </div>
            </div>
            <div class="header-right">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>Server Running</span>
                </div>
                <button id="themeToggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="app-main single wide">
            <div class="card">
                <div class="card-header card-header-split">
                    <div>
                        <div class="card-header-row">
                            <div class="card-header-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                            <div class="card-title">ประวัติการจดค่า</div>
                        </div>
                        <div id="historySummary" class="card-subtitle" style="margin-top:0.35rem">กำลังโหลด…</div>
                    </div>
                    <a href="/" class="btn btn-outline btn-sm">
                        <i class="fa-solid fa-arrow-left"></i> เลือก Meter Run
                    </a>
                </div>

                <div class="card-body">
                    <label class="form-field history-filter">
                        <span>Meter Run</span>
                        <select id="runFilter">
                            <option value="">ทั้งหมด</option>
                        </select>
                    </label>

                    <div id="historyState" class="run-list-state">กำลังโหลด…</div>

                    <div class="history-table-wrap">
                        <table id="historyTable" class="params-table history-table hidden">
                            <thead>
                                <tr>
                                    <th>วัน/เวลาที่จด</th>
                                    <th>Meter Run</th>
                                    <th class="align-right">CORRECT V.</th>
                                    <th class="align-right">LINE V.</th>
                                    <th class="align-right">TURBINE V.</th>
                                    <th class="align-center" title="จำนวนค่าที่คนแก้ / จำนวนค่าที่มีในรายการ">แก้ด้วยมือ</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="historyBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            &copy; Meter Industrial Reader Portal ·
        </footer>

    </div>
    <script src="/static/theme.js?v=6"></script>
    <script src="/static/history.js?v=2"></script>
</body>

</html>
