<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือก Meter Run — Automated Industrial Gas Meter Reading with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/index.css?v=14">
</head>

<body>
    <div class="app-shell">

        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-gauge-high"></i></div>
                <div class="logo-text">
                    <h1>Automated Industrial Gas Meter Reading with AI</h1>
                    <span>Meter Industrial Reader Portal</span>
                </div>
            </div>
            <div class="header-right">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>Server Running</span>
                </div>
                <button id="themeToggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="app-main single">

            <!-- ฟอร์มเพิ่ม Meter Run (ซ่อนจนกดปุ่ม "เพิ่ม Meter Run") -->
            <div id="addRunCard" class="card hidden">
                <div class="card-header">
                    <div class="card-header-row">
                        <div class="card-header-icon"><i class="fa-solid fa-plus"></i></div>
                        <div class="card-title">เพิ่ม Meter Run</div>
                    </div>
                </div>
                <form id="addRunForm" class="card-body" novalidate>
                    <div class="form-grid">
                        <label class="form-field">
                            <span>บริษัท <em>*</em></span>
                            <input name="company" required placeholder="เช่น ASM, COFCO" autocomplete="off">
                        </label>
                        <label class="form-field">
                            <span>Run <em>*</em></span>
                            <input name="run_label" required placeholder="เช่น A, B" autocomplete="off">
                        </label>
                    </div>

                    <div class="section-label"><i class="fa-solid fa-microchip"></i> Electronic Volume Corrector (FY)</div>
                    <div class="form-grid">
                        <label class="form-field">
                            <span>Tag FY</span>
                            <input name="tag_fy" placeholder="เช่น ASM-0330-FY-057A" autocomplete="off">
                        </label>
                        <label class="form-field">
                            <span>Serial FY</span>
                            <input name="serial_fy" autocomplete="off">
                        </label>
                    </div>

                    <div class="section-label"><i class="fa-solid fa-gear"></i> Turbine Meter (FE)</div>
                    <div class="form-grid">
                        <label class="form-field">
                            <span>Tag FE</span>
                            <input name="tag_fe" placeholder="เช่น ASM-0330-FE-057A" autocomplete="off">
                        </label>
                        <label class="form-field">
                            <span>Serial FE</span>
                            <input name="serial_fe" autocomplete="off">
                        </label>
                    </div>

                    <div id="addRunError" class="form-error hidden" role="alert"></div>

                    <div class="form-actions">
                        <button type="button" id="cancelAddRunBtn" class="btn btn-outline">ยกเลิก</button>
                        <button type="submit" id="saveRunBtn" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> บันทึก Meter Run
                        </button>
                    </div>
                </form>
            </div>

            <!-- รายการ Meter Run (เลือกได้ทีละ 1) -->
            <div class="card">
                <div class="card-header card-header-split">
                    <div>
                        <div class="card-header-row">
                            <div class="card-header-icon"><i class="fa-solid fa-list-check"></i></div>
                            <div class="card-title">เลือก Meter Run</div>
                        </div>
                        <div class="card-subtitle" style="margin-top:0.35rem">เลือก 1 Run ที่จะอ่านค่ามิเตอร์</div>
                    </div>
                    <div class="header-actions">
                        <a href="/history" class="btn btn-outline btn-sm">
                            <i class="fa-solid fa-clock-rotate-left"></i> ประวัติการจด
                        </a>
                        <button type="button" id="showAddRunBtn" class="btn btn-outline btn-sm">
                            <i class="fa-solid fa-plus"></i> เพิ่ม Meter Run
                        </button>
                    </div>
                </div>

                <div class="card-body">
                    <div id="runListState" class="run-list-state">กำลังโหลด…</div>
                    <div id="runList" class="run-list" role="radiogroup" aria-label="Meter Run"></div>

                    <button id="goOcrBtn" class="btn btn-primary btn-full" disabled>
                        <i class="fa-solid fa-camera"></i> ไปหน้าอ่านค่า
                    </button>
                </div>
            </div>

        </main>

        <footer class="app-footer">
            &copy; Meter Industrial Reader Portal ·
        </footer>

    </div>
    <script src="/static/theme.js?v=6"></script>
    <script src="/static/runs.js?v=7"></script>
</body>

</html>
